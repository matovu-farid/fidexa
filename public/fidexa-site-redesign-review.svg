  <rect x="916" y="3800" width="430" height="180" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="950" y="3860" class="label muted">CARD / PROJECT</text>
  <text x="950" y="3915" class="h3 ink">Readable by design.</text>
